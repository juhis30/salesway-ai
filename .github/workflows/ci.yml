# Checks every push and pull request. Render deploys main only after these pass (render.yaml:
# autoDeployTrigger: checksPass), so a change that breaks tests or the build never goes live.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (SQLite and Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salesway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on Postgres (with row-level security enforced)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salesway_test
        run: python -m pytest -q
      - name: Migrations apply cleanly from scratch
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: alembic upgrade head

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://salesway-api.onrender.com/api/v1

  dependencies:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages (pip-audit)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm packages (high and critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
