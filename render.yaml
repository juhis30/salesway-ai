# Render Blueprint: the API and the web app as two free web services.
# The database is Neon Postgres; its connection string is entered once in Render (DATABASE_URL).
# Every push to main redeploys both. See docs/deployment.md.

services:
  - type: web
    name: salesway-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Applies any new database migrations, then starts the API.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # paste the Neon connection string when Render asks
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://salesway-web.onrender.com","http://localhost:3000"]'
      - key: LLM_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock
      # CRM connections (docs/integrations.md)
      - key: CREDENTIALS_KEY
        generateValue: true # encrypts stored CRM tokens; changing it means reconnecting
      - key: PUBLIC_API_URL
        value: https://salesway-api.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://salesway-web.onrender.com
      - key: SYNC_CRON_TOKEN
        generateValue: true # copy into the GitHub secret SYNC_CRON_TOKEN to enable hourly syncs
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false

  - type: web
    name: salesway-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the app at build time.
      - key: NEXT_PUBLIC_API_URL
        value: https://salesway-api.onrender.com/api/v1
